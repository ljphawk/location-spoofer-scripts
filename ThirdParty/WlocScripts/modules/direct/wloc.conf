#!name=Apple WLOC 定位修改
#!desc=Apple 网络定位修改 | 使用说明: https://github.com/ljphawk/location-spoofer-scripts/blob/main/docs/THIRD_PARTY_MODULES.md
#!author=Yu9191 Rewrite
#!homepage=https://github.com/ljphawk/location-spoofer-scripts

[rewrite_local]
^https?:\/\/(?:gs-loc(?:-cn)?\.apple\.com|gsp-ssl\.ls\.apple\.com|bluedot\.is\.autonavi\.com(?:\.gds\.alibabadns\.com)?)\/clls\/wloc url script-response-body https://raw.githubusercontent.com/ljphawk/location-spoofer-scripts/main/ThirdParty/WlocScripts/dist/v2/wloc.js?v=1.0.9-control1
^https?:\/\/(?:wloc-control\.invalid|gs-loc(-cn)?\.apple\.com)\/wloc-settings\/save url script-echo-response https://raw.githubusercontent.com/ljphawk/location-spoofer-scripts/main/ThirdParty/WlocScripts/dist/v2/wloc-settings.js?v=1.0.9-control1

[mitm]
hostname = wloc-control.invalid, gs-loc.apple.com, gs-loc-cn.apple.com, gsp-ssl.ls.apple.com, bluedot.is.autonavi.com, bluedot.is.autonavi.com.gds.alibabadns.com

[dns]
address=/wloc-control.invalid/192.0.2.1

[filter_local]
host, wloc-control.invalid, direct
